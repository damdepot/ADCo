[project]
name = "ADCo"
version = "1.0.0-alpha"
description = "Application Database Co-design"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.12.0",
    "mysqlclient>=2.2.8",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "pytest>=8.0.0",
    "sqlparse>=0.5.5",
    "google-adk>=2.5.0",
    "pymysql>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

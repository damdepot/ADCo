services:
  pgdb:
    image: postgres:17
    container_name: adcoexp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      # Loopback-only: the benchmark harness and tuner all connect via
      # 127.0.0.1, so never expose Postgres to the LAN/WAN (brute-force +
      # COPY-PROGRAM RCE risk, especially with the default password).
      - "127.0.0.1:5432:5432"
    platform: linux/amd64
    # Limits are env-driven so the benchmark harness's CPU_CORES/MEMORY_GB
    # match what the container actually gets (defaults preserve 2 cpus / 8g).
    deploy:
      resources:
        limits:
          cpus: "${CPU_CORES:-2}"
          memory: "${MEMORY_GB:-8}g"
    shm_size: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  db-init:
    image: postgres:17
    container_name: adcoexp-db-init
    restart: "no"
    platform: linux/amd64
    environment:
      PGHOST: pgdb
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    depends_on:
      pgdb:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 <<-EOSQL
          SELECT 'CREATE DATABASE smallbank' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'smallbank')\gexec
          SELECT 'CREATE DATABASE tpcc' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'tpcc')\gexec
          SELECT 'CREATE DATABASE adcodb' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'adcodb')\gexec
        EOSQL

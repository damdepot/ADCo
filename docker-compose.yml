services:
  mysql-db:
    image: mysql:8.4
    platform: linux/amd64
    container_name: adco-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mysql_root_password
      MYSQL_DATABASE: adco_db
    volumes:
      - mysql_data:/var/lib/mysql
    command: --mysql-native-password=ON

volumes:
  mysql_data:
